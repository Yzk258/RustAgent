<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0f14" id="theme-color">
  <script>document.documentElement.dataset.theme = localStorage.getItem("rustagent-theme") === "light" ? "light" : "dark";</script>
  <title>RustAgent · MC 模组管理助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⛏</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" data-layout="workspace">

    <!-- 顶栏: 品牌名 / 当前模型 / 连接状态 -->
    <header id="topbar">
      <div class="brand"><span class="brand-icon">⛏</span>RustAgent · MC 模组管理助手 <span class="ver" id="ver"></span></div>
      <div class="model" id="model-name"></div>
      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">连接中…</span>
      </div>
      <button id="btn-theme" class="icon-btn" type="button" title="切换到白天模式" aria-label="切换到白天模式">☀</button>
      <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
    </header>

    <!-- 侧栏: 每张 .card 是一个独立面板, 新增功能面板时复制一个 section 并在 app.js 里补数据加载 -->
    <aside id="sidebar">
      <section class="card">
        <div class="card-head">
          <h3>会话</h3>
          <button id="btn-open-sessions">打开目录</button>
        </div>
        <div class="btn-row">
          <button id="btn-new">新会话</button>
        </div>
        <div class="kv dim" id="session-file">自动保存: 尚无对话</div>
        <ul class="pack-list" id="session-list"></ul>
      </section>

      <section class="card">
        <h3>统计</h3>
        <div class="kv" id="stat-usage">-</div>
        <div class="kv dim" id="stat-turn">尚无调用</div>
        <div class="kv" id="stat-db">-</div>
        <div class="tags" id="tag-weights"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h3>已生成整合包</h3>
          <button id="btn-open-dir">打开目录</button>
        </div>
        <div class="kv dim" id="pack-dir"></div>
        <ul class="pack-list" id="pack-list"></ul>
      </section>

      <section class="card">
        <div class="card-head">
          <h3>试试这个</h3>
          <button id="btn-rec">换一批</button>
        </div>
        <div class="kv dim" id="rec-hint">先选 MC 版本, 点"换一批"拉取推荐</div>
        <ul class="rec-list" id="rec-list"></ul>
      </section>

      <section class="card">
        <h3>可用工具</h3>
        <ul class="tool-list" id="tool-list"></ul>
      </section>
    </aside>

    <!-- 主聊天区 -->
    <main id="chat" aria-label="聊天工作区">
      <div id="messages" role="log" aria-live="polite" aria-label="对话记录"></div>
      <!-- 预设工具栏: 单条胶囊, 与聊天区同宽对齐; 隐藏 input 保留原 id 供 JS 读取 -->
      <form id="presetbar" aria-label="整合包预设">
        <div class="preset-bar">
          <label class="plabel" for="sel-version">版本</label>
          <input id="sel-version" list="version-list" placeholder="1.21.1" autocomplete="off" spellcheck="false">
          <datalist id="version-list">
            <option value="1.21.1"></option>
            <option value="1.21.4"></option>
            <option value="1.21.5"></option>
            <option value="1.20.1"></option>
            <option value="1.20.4"></option>
            <option value="1.19.2"></option>
            <option value="1.18.2"></option>
            <option value="1.16.5"></option>
            <option value="1.12.2"></option>
            <option value="1.7.10"></option>
          </datalist>
          <span class="preset-divider"></span>
          <span class="plabel">加载器</span>
          <div class="seg" id="seg-loader" role="group" aria-label="加载器">
            <button type="button" class="seg-btn active" data-value="fabric">fabric</button>
            <button type="button" class="seg-btn" data-value="forge">forge</button>
            <button type="button" class="seg-btn" data-value="neoforge">neoforge</button>
            <button type="button" class="seg-btn" data-value="quilt">quilt</button>
          </div>
          <input type="hidden" id="sel-loader" value="fabric">
          <span class="preset-divider"></span>
          <label class="plabel" for="sel-limit">数量</label>
          <select id="sel-limit">
            <option value="5">5 个</option>
            <option value="8" selected>8 个</option>
            <option value="10">10 个</option>
            <option value="15">15 个</option>
            <option value="20">20 个</option>
            <option value="custom">自定义</option>
          </select>
          <span id="custom-limit-wrap" class="hidden" title="单次对话上限 20">
            <input id="input-limit" type="number" min="1" max="20" placeholder="1-20" autocomplete="off">
          </span>
          <span class="hint">预设后直接执行, 不再追问</span>
        </div>
      </form>
      <form id="inputbar">
        <textarea id="input" rows="1"
          placeholder="描述你想要的整合包… (Enter 发送, Shift+Enter 换行)"></textarea>
        <button id="btn-stop" class="hidden">⏸ 打断</button>
        <button id="btn-send">发送</button>
      </form>
    </main>
  </div>

  <!-- 设置弹窗: 运行时修改 LLM 配置, 保存后热生效并写回 config.toml -->
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="设置">
    <div class="modal-mask" id="settings-mask"></div>
    <div class="modal-panel">
      <div class="modal-head">
        <h3>⚙ 设置</h3>
        <button type="button" id="btn-settings-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <form id="settings-form" class="modal-body">
        <label class="field">模型
          <input id="set-model" autocomplete="off" spellcheck="false" placeholder="如 deepseek-chat">
        </label>
        <label class="field">API 地址
          <input id="set-base-url" autocomplete="off" spellcheck="false" placeholder="https://api.deepseek.com/v1">
        </label>
        <label class="field">API Key
          <input id="set-api-key" type="password" autocomplete="off" placeholder="">
          <span class="field-hint" id="set-key-hint"></span>
        </label>
        <div class="field-grid">
          <label class="field">上下文长度
            <input id="set-ctx" type="number" min="256" step="1">
          </label>
          <label class="field">Token 预算 (0 = 不限)
            <input id="set-budget" type="number" min="0" step="1000">
          </label>
          <label class="field">工具调用上限
            <input id="set-max-tools" type="number" min="1" step="1">
          </label>
          <label class="field">输入单价 (元/百万)
            <input id="set-price-in" type="number" min="0" step="0.01">
          </label>
          <label class="field">输出单价 (元/百万)
            <input id="set-price-out" type="number" min="0" step="0.01">
          </label>
        </div>
        <label class="field">思考模式透传
          <input id="set-thinking" autocomplete="off" spellcheck="false" placeholder="如 reasoning_effort=medium, 留空不发送">
          <span class="field-hint">key=value 格式, 逗号分隔多组; auto 或留空 = 不发送</span>
        </label>
        <label class="switch-row">
          <input id="set-cf" type="checkbox" class="switch-input">
          <span class="switch" aria-hidden="true"></span>
          <span class="switch-text">CurseForge 独占 mod 支持
            <span class="field-hint">实验性: 开启后可点名 CurseForge 独占 mod 参与组包, 保存后立即生效</span>
          </span>
        </label>
        <div class="modal-foot">
          <span class="field-hint">保存后立即生效, 并写回 config.toml</span>
          <button type="button" id="btn-settings-cancel">取消</button>
          <button type="submit" id="btn-settings-save" class="primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
